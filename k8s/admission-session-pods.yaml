# OPTIONAL but recommended — requires Kubernetes >= 1.30 (ValidatingAdmissionPolicy GA).
#
# The service holds `create pods` + `pods/exec` in this namespace. If it were ever compromised
# (a bug in the HTTP layer, a leaked bearer token plus an RCE), the attacker could ask the
# apiserver for a pod WITHOUT runtimeClassName: gvisor — i.e. run untrusted code under runc on
# the sandbox nodes — or one with a ServiceAccount token mounted. PodSecurity `baseline`
# (k8s/namespace.yaml) does not stop either.
#
# This policy is the cluster-side guarantee our own code cannot bypass: every pod CREATED BY
# THE SERVICE'S SERVICEACCOUNT must carry the gVisor RuntimeClass and the no-credentials
# posture the provider sets. It is keyed on the requesting user, not on a label, because a
# label is exactly what a compromised service would omit. The service's own pods are created
# by the ReplicaSet controller, so they are not subject to it.
#
#   kubectl apply -f k8s/admission-session-pods.yaml
#
# If your RuntimeClass is not named `gvisor`, change it in BOTH `validations` and the
# service's SANDBOX_K8S_RUNTIME_CLASS.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: llm-sandbox-session-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: llm-sandbox
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: created-by-the-sandbox-service
      expression: "request.userInfo.username == 'system:serviceaccount:llm-sandbox:llm-sandbox'"
  # privileged / hostNetwork / hostPID / hostIPC / hostPath are already refused by the
  # PodSecurity `baseline` label on the namespace — only what baseline does NOT check is here.
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor'"
      message: "session pods must run under runtimeClassName: gvisor"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "session pods must not mount a ServiceAccount token"
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          'memory' in c.resources.limits && 'ephemeral-storage' in c.resources.limits)
      message: "session containers must carry memory and ephemeral-storage limits"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: llm-sandbox-session-pods
spec:
  policyName: llm-sandbox-session-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: llm-sandbox
