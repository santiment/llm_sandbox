# OPTIONAL — requires metrics-server in the cluster. Apply once you have real traffic
# numbers; until then the fixed replicas: 2 in the Deployment is the safer default.
#
# The service is stateless (session id -> pod name is derived, no in-memory map), so any
# replica can serve any session and scaling needs no affinity or sticky routing.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-sandbox
  namespace: llm-sandbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-sandbox
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Sessions are long-lived; don't yank replicas out from under in-flight execs.
      stabilizationWindowSeconds: 300
